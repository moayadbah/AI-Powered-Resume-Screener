name: ai-service

on:
  pull_request:
    paths:
      - 'ai-service/**'
      - 'docs/fixtures/**'
      - '.github/workflows/ai-service.yml'
  push:
    branches: [main]
    paths:
      - 'ai-service/**'
      - 'docs/fixtures/**'

defaults:
  run:
    working-directory: ai-service

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # 3.11 to match the Dockerfile. torch/sentence-transformers wheels lag
      # newer Python releases; on 3.13+ pip falls back to building from source.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            ai-service/requirements.txt
            ai-service/requirements-dev.txt

      # The embedding model is ~90 MB. Without this every run re-downloads it.
      - name: Cache the model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ hashFiles('ai-service/requirements.txt') }}-all-MiniLM-L6-v2

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # Pinned, and installed from the CPU index first so the pip resolver
          # doesn't pull the default CUDA build over the top.
          pip install torch==2.13.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt -r requirements-dev.txt

      # An out-of-date pin is a security finding, not a stability win.
      - name: Audit dependencies
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt --progress-spinner off

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Test
        env:
          # Generated per run - a literal here reads as a hardcoded credential.
          SERVICE_TOKEN: ${{ github.run_id }}-${{ github.run_attempt }}
          # No Ollama in CI. Tests stub the HTTP calls with respx; this just
          # guarantees a real one would fail fast rather than hang.
          OLLAMA_BASE_URL: http://127.0.0.1:1
          OLLAMA_TIMEOUT_SECONDS: '2'
        run: pytest -q

  # The image is a deliverable, so build it here. It is also ~2 GB, which is
  # more than a laptop with a full disk can spare.
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: docker build -t ai-service:ci ./ai-service

      - name: CPU-only torch, no CUDA
        run: |
          out=$(docker run --rm ai-service:ci python -c \
            "import torch; print(torch.__version__, torch.version.cuda)")
          echo "$out"
          echo "$out" | grep -q '+cpu None' || { echo "::error::not the CPU build"; exit 1; }

      - name: Starts with no network, model baked in, non-root
        run: |
          docker run -d --rm --name ai --network none -e SERVICE_TOKEN=$GITHUB_RUN_ID ai-service:ci
          for i in $(seq 1 45); do
            if docker exec ai python -c "import urllib.request;print(urllib.request.urlopen('http://localhost:8000/health').read().decode())" 2>/dev/null; then
              ok=1; break
            fi
            sleep 2
          done
          [ "${ok:-0}" = 1 ] || { echo "::error::never became healthy offline"; docker logs ai; exit 1; }
          [ "$(docker exec ai whoami)" = appuser ] || { echo "::error::running as root"; exit 1; }
          docker stop ai
