name: web

on:
  pull_request:
    paths:
      - 'web/**'
      - 'docs/contracts/api-service.openapi.yaml'
      - '.github/workflows/web.yml'
  push:
    branches: [main]
    paths:
      - 'web/**'

defaults:
  run:
    working-directory: web

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      # src/api/types.ts is generated from the OpenAPI spec and committed.
      # If regenerating produces a diff, the spec moved and the frontend is
      # still compiling against the old shapes.
      - name: Types match the contract
        run: |
          npm run gen:types
          if ! git diff --quiet -- src/api/types.ts; then
            echo "::error::src/api/types.ts is stale. Run 'npm run gen:types' and commit."
            git diff -- src/api/types.ts
            exit 1
          fi

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
        env:
          VITE_API_BASE_URL: http://localhost:8080
