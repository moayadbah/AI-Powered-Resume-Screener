name: contracts

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    name: lint openapi specs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Redocly lint
        run: npx --yes @redocly/cli@1.34.2 lint

  drift:
    name: contract drift check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Routing/controller code changed but the contract didn't. Usually means
      # an endpoint was added or reshaped without writing it down first, which
      # is how the two services drift apart.
      #
      # Add the `contract-unchanged` label if the change genuinely doesn't touch
      # the interface (a refactor, a rename inside a handler).
      - name: Fail if routes changed without the contract
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'contract-unchanged') }}
        run: |
          set -euo pipefail
          base="origin/${{ github.base_ref }}"
          changed="$(git diff --name-only "$base"...HEAD)"

          routes="$(echo "$changed" | grep -E \
            'api-service/src/main/java/.*/controller/|ai-service/app/routers/' || true)"
          contract="$(echo "$changed" | grep -E \
            'docs/03-API-CONTRACT\.md|docs/contracts/' || true)"

          if [ -n "$routes" ] && [ -z "$contract" ]; then
            echo "::error::Route files changed but docs/03-API-CONTRACT.md and docs/contracts/ did not."
            echo ""
            echo "Changed route files:"
            echo "$routes" | sed 's/^/  /'
            echo ""
            echo "The contract is the source of truth. Update it in the same PR, or"
            echo "add the 'contract-unchanged' label if the interface really didn't move."
            exit 1
          fi
          echo "OK"

      # The markdown doc and the machine-readable spec have to move together,
      # otherwise generated clients drift from the documented behaviour.
      - name: Warn if the doc and the specs disagree about who changed
        run: |
          set -euo pipefail
          base="origin/${{ github.base_ref }}"
          changed="$(git diff --name-only "$base"...HEAD)"
          md="$(echo "$changed" | grep -c 'docs/03-API-CONTRACT\.md' || true)"
          yaml="$(echo "$changed" | grep -c 'docs/contracts/.*\.yaml' || true)"

          if [ "$md" -gt 0 ] && [ "$yaml" -eq 0 ]; then
            echo "::warning::03-API-CONTRACT.md changed but no OpenAPI spec did. Intended?"
          elif [ "$yaml" -gt 0 ] && [ "$md" -eq 0 ]; then
            echo "::warning::An OpenAPI spec changed but 03-API-CONTRACT.md did not. Intended?"
          fi
