name: api-service

on:
  pull_request:
    paths:
      - 'api-service/**'
      - '.github/workflows/api-service.yml'
  push:
    branches: [main]
    paths:
      - 'api-service/**'

defaults:
  run:
    working-directory: api-service

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # verify runs the integration tests too, which need a Docker daemon for
      # Testcontainers. ubuntu-latest has one; don't switch to macos runners
      # without checking that.
      - name: Build and test
        run: ./mvnw -B verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: api-service/target/*-reports/
          retention-days: 7
