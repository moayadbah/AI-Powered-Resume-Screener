spring:
  application:
    name: api-service
  data:
    mongodb:
      uri: ${MONGODB_URI}
      auto-index-creation: false
  servlet:
    multipart:
      max-file-size: ${MAX_UPLOAD_SIZE_MB:5}MB
      max-request-size: 60MB
management:
  endpoints:
    web:
      exposure:
        include: health
  health:
    mongo:
      enabled: true
  endpoint:
    health:
      show-components: always
      status:
        http-mapping:
          down: 200
          out-of-service: 200
app:
  jwt:
    secret: ${JWT_SECRET}
    expiry-hours: ${JWT_EXPIRY_HOURS:24}
  ai:
    base-url: ${AI_SERVICE_BASE_URL:http://ai-service:8000}
    service-token: ${SERVICE_TOKEN}
    connect-timeout-ms: 5000
    read-timeout-ms: 60000
  upload:
    dir: ${UPLOAD_DIR:/data/uploads}
    max-files-per-request: ${MAX_FILES_PER_REQUEST:10}
    max-size-mb: ${MAX_UPLOAD_SIZE_MB:5}
  screening:
    max-resumes: ${MAX_RESUMES_PER_SCREEN:50}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
logging:
  pattern:
    level: "%5p [traceId:%X{traceId:-}]"
